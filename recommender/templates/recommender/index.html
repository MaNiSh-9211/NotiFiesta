<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Recommendation</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background: #f4f6fb; margin: 0; padding: 0; }
        .container { max-width: 700px; margin: 40px auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); padding: 32px; }
        h1 { text-align: center; color: #2d3a4b; }
        form { display: flex; justify-content: center; margin-bottom: 32px; }
        input[type="text"] { padding: 10px; font-size: 1.1em; border: 1px solid #cfd8dc; border-radius: 6px 0 0 6px; outline: none; width: 60%; }
        button { padding: 10px 24px; font-size: 1.1em; border: none; background: #4f8cff; color: #fff; border-radius: 0 6px 6px 0; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        .books { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .book { background: #f9fafb; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); padding: 16px; display: flex; gap: 16px; align-items: flex-start; }
        .book img { width: 90px; height: 130px; object-fit: cover; border-radius: 4px; }
        .book-info { flex: 1; }
        .book-title { font-size: 1.1em; font-weight: 700; color: #1e293b; margin: 0 0 8px 0; }
        .book-desc { font-size: 0.98em; color: #475569; }
        @media (max-width: 600px) { .books { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Book Recommendation</h1>
        <form method="post">
            {% csrf_token %}
            <input type="text" name="genre" placeholder="Enter book type or genre (e.g. mystery, romance)" value="{{ genre|default:'' }}" required>
            <button type="submit">Recommend</button>
        </form>
        {% if books %}
        <div class="books">
            {% for book in books %}
            <div class="book">
                <img src="/{{ book.image }}" alt="{{ book.title }}">
                <div class="book-info">
                    <div class="book-title">{{ book.title }}</div>
                    <div class="book-desc">{{ book.desc }}</div>
                </div>
            </div>
            {% endfor %}
        </div>
        {% elif genre %}
            <p style="text-align:center; color:#e11d48;">No books found for "{{ genre }}".</p>
        {% endif %}
    </div>
</body>
</html>
